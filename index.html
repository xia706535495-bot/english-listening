<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF9F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='none' stroke='%232D5A3D' stroke-width='8'/%3E%3Cpolygon points='40,32 68,50 40,68' fill='%232D5A3D'/%3E%3C/svg%3E">
<title>每日听力</title>
<style>
  /* ===== 设计 token ===== */
  :root {
    --bg: #FAF9F6;
    --bg-soft: #F1EFE9;
    --ink: #1A1A1A;
    --ink-soft: #6B6B6B;
    --ink-faint: #A8A8A8;
    --line: #E2DFD8;
    --accent: #2D5A3D;
    --accent-soft: #E4EDE6;
    --warn: #B85C3A;
    --radius: 10px;
    --shadow: 0 2px 12px rgba(0,0,0,0.04);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 顶部栏 ===== */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: max(env(safe-area-inset-top), 16px) 20px 8px;
  }
  .topbar .date {
    font-size: 14px;
    color: var(--ink-soft);
    letter-spacing: 0.3px;
  }
  .icon-btn {
    width: 40px; height: 40px;
    border: none; background: transparent;
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    border-radius: 50%;
  }
  .icon-btn:active { background: var(--bg-soft); }
  .icon-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ===== 首页主区 ===== */
  .home {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 24px 40px;
    min-height: calc(100vh - 60px - env(safe-area-inset-top));
    min-height: calc(100dvh - 60px - env(safe-area-inset-top));
  }

  /* 圆圈播放键 + 进度环 */
  .circle-wrap {
    position: relative;
    width: 240px; height: 240px;
    margin: 30px 0 24px;
  }
  .circle-wrap svg.ring {
    width: 100%; height: 100%;
    transform: rotate(-90deg);
  }
  .circle-wrap .ring-bg {
    fill: none;
    stroke: var(--bg-soft);
    stroke-width: 8;
  }
  .circle-wrap .ring-fg {
    fill: none;
    stroke: var(--accent);
    stroke-width: 8;
    stroke-linecap: round;
    stroke-dasharray: 660;
    stroke-dashoffset: 660;
    transition: stroke-dashoffset 0.4s ease;
  }
  .play-btn {
    position: absolute;
    inset: 20px;
    border-radius: 50%;
    border: none;
    background: var(--ink);
    color: var(--bg);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s ease, background 0.2s;
    box-shadow: var(--shadow);
  }
  .play-btn:active { transform: scale(0.96); }
  .play-btn svg { width: 48px; height: 48px; fill: currentColor; }
  .play-btn.playing { background: var(--accent); }

  /* 今日时长 */
  .today-stats {
    text-align: center;
    margin-bottom: 24px;
  }
  .today-stats .num {
    font-size: 32px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
  }
  .today-stats .num .unit {
    font-size: 16px;
    font-weight: 400;
    color: var(--ink-soft);
    margin-left: 4px;
  }
  .today-stats .label {
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .goal-done { color: var(--accent); }

  /* 当前播放内容卡片 */
  .now-playing {
    width: 100%;
    max-width: 420px;
    background: var(--bg-soft);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .now-playing .np-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--ink-faint);
    margin-bottom: 6px;
  }
  .now-playing .np-title {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 6px;
  }
  .now-playing .np-meta {
    font-size: 13px;
    color: var(--ink-soft);
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .tag.news { background: #EAE3D8; color: #7A5A2E; }
  .tag.daily { background: #E4EDE6; color: #2D5A3D; }
  .tag.drama { background: #E8E0E8; color: #6B3A6B; }

  /* 进度条（当前音频） */
  .progress-wrap {
    width: 100%;
    max-width: 420px;
    margin-bottom: 12px;
  }
  .progress-bar {
    width: 100%;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: var(--ink);
    border-radius: 2px;
    width: 0%;
    transition: width 0.2s linear;
  }
  .progress-times {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--ink-faint);
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }

  /* 控制按钮行 */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    margin-top: 8px;
  }
  .ctrl {
    background: none; border: none;
    color: var(--ink);
    cursor: pointer;
    width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
  }
  .ctrl:active { background: var(--bg-soft); }
  .ctrl svg { width: 26px; height: 26px; fill: currentColor; }
  .ctrl.speed {
    width: auto; height: 36px;
    padding: 0 12px;
    font-size: 13px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* 下一段预告 */
  .up-next {
    margin-top: 28px;
    font-size: 13px;
    color: var(--ink-faint);
    text-align: center;
    max-width: 320px;
  }

  /* ===== 字幕面板 ===== */
  .transcript {
    width: 100%;
    max-width: 420px;
    margin-top: 20px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    font-size: 15px;
    line-height: 1.7;
    display: none;
  }
  .transcript.show { display: block; }
  .transcript .t-en { margin-bottom: 10px; }
  .transcript .t-zh { color: var(--ink-soft); font-size: 14px; }
  .transcript .t-label {
    font-size: 11px; color: var(--ink-faint);
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 8px;
  }

  /* ===== 功能抽屉 ===== */
  .drawer-mask {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.3);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
    z-index: 40;
  }
  .drawer-mask.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 85%; max-width: 340px;
    background: var(--bg);
    z-index: 50;
    transform: translateX(100%);
    transition: transform 0.3s ease;
    overflow-y: auto;
    padding: max(env(safe-area-inset-top), 20px) 20px calc(env(safe-area-inset-bottom) + 20px);
  }
  .drawer.open { transform: translateX(0); }
  .drawer h3 {
    font-size: 13px;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin: 24px 0 10px;
    font-weight: 600;
  }
  .drawer h3:first-child { margin-top: 0; }
  .drawer .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .drawer .row:last-child { border-bottom: none; }
  .drawer .row .label { font-size: 15px; }
  .drawer .row .value {
    font-size: 14px;
    color: var(--ink-soft);
  }
  .drawer .row .value.active { color: var(--accent); font-weight: 600; }

  /* ===== 全屏视图（每周总结/离线管理） ===== */
  .view {
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 60;
    transform: translateX(100%);
    transition: transform 0.3s ease;
    overflow-y: auto;
    padding: max(env(safe-area-inset-top), 16px) 20px calc(env(safe-area-inset-bottom) + 20px);
  }
  .view.open { transform: translateX(0); }
  .view-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 20px;
  }
  .view-header .back {
    background: none; border: none;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    border-radius: 50%;
  }
  .view-header .back:active { background: var(--bg-soft); }
  .view-header .back svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .view-header h2 { font-size: 18px; margin: 0; font-weight: 600; }

  /* 每周总结 */
  .weekly-hero {
    text-align: center;
    padding: 30px 0 20px;
  }
  .weekly-hero .big {
    font-size: 56px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -1px;
    line-height: 1;
  }
  .weekly-hero .big .unit { font-size: 20px; font-weight: 400; color: var(--ink-soft); }
  .weekly-hero .sub { color: var(--ink-soft); margin-top: 8px; font-size: 14px; }
  .weekly-hero .streak {
    display: inline-block;
    margin-top: 14px;
    padding: 6px 14px;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
  }

  .section-title {
    font-size: 13px;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 28px 0 12px;
    font-weight: 600;
  }

  /* 主题分布条 */
  .topic-bar {
    display: flex;
    height: 10px;
    border-radius: 5px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .topic-bar .seg { height: 100%; }
  .topic-bar .seg.daily { background: #2D5A3D; }
  .topic-bar .seg.news { background: #B8923A; }
  .topic-bar .seg.drama { background: #6B3A6B; }
  .legend {
    display: flex; gap: 16px; flex-wrap: wrap;
    font-size: 12px; color: var(--ink-soft);
  }
  .legend .dot {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; margin-right: 5px;
    vertical-align: middle;
  }

  /* 每日柱子 */
  .days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    align-items: end;
    height: 100px;
    margin-top: 8px;
  }
  .days-grid .day-col {
    display: flex; flex-direction: column;
    align-items: center; gap: 4px;
    height: 100%;
    justify-content: flex-end;
  }
  .days-grid .bar {
    width: 100%;
    max-width: 24px;
    background: var(--accent-soft);
    border-radius: 3px 3px 0 0;
    min-height: 2px;
    position: relative;
  }
  .days-grid .bar.met { background: var(--accent); }
  .days-grid .day-label {
    font-size: 10px;
    color: var(--ink-faint);
  }

  /* 内容列表 */
  .episode-item {
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .episode-item:last-child { border-bottom: none; }
  .episode-item .ep-title {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .episode-item .ep-meta {
    font-size: 12px;
    color: var(--ink-faint);
    display: flex; gap: 10px;
  }

  /* 离线管理 */
  .offline-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .offline-card .row {
    display: flex; justify-content: space-between;
    align-items: center;
    padding: 8px 0;
  }
  .offline-card .row .k { font-size: 14px; color: var(--ink-soft); }
  .offline-card .row .v { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .btn {
    background: var(--ink);
    color: var(--bg);
    border: none;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    width: 100%;
    margin-top: 8px;
  }
  .btn:active { opacity: 0.85; }
  .btn.ghost {
    background: transparent;
    color: var(--warn);
    border: 1px solid var(--line);
  }

  /* toast */
  .toast {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--bg);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s;
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 加载状态 */
  .loading {
    text-align: center;
    color: var(--ink-faint);
    font-size: 13px;
    padding: 20px;
  }

  /* 桌面端微调 */
  @media (min-width: 768px) {
    .home { padding-top: 60px; }
    .circle-wrap { width: 280px; height: 280px; }
  }
</style>
</head>
<body>

<!-- 顶部栏 -->
<div class="topbar">
  <div class="date" id="topDate">--</div>
  <button class="icon-btn" id="openDrawer" aria-label="设置">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</div>

<!-- 首页 -->
<div class="home" id="homeView">
  <div class="circle-wrap">
    <svg class="ring" viewBox="0 0 220 220">
      <circle class="ring-bg" cx="110" cy="110" r="105"/>
      <circle class="ring-fg" id="ringFg" cx="110" cy="110" r="105"/>
    </svg>
    <button class="play-btn" id="playBtn" aria-label="播放/暂停">
      <svg id="playIcon" viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"/></svg>
    </button>
  </div>

  <div class="today-stats">
    <div class="num"><span id="todaySeconds">0</span><span class="unit" id="todayUnit">分钟</span></div>
    <div class="label" id="todayLabel">今日目标 30 分钟</div>
  </div>

  <div class="now-playing" id="nowPlayingCard" style="display:none">
    <div class="np-label">正在播放</div>
    <div class="np-title" id="npTitle">--</div>
    <div class="np-meta">
      <span class="tag" id="npTag">--</span>
      <span id="npDuration">--</span>
    </div>
  </div>

  <div class="progress-wrap" id="progressWrap" style="display:none">
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-times">
      <span id="curTime">0:00</span>
      <span id="durTime">0:00</span>
    </div>
  </div>

  <div class="controls" id="controlsRow" style="visibility:hidden">
    <button class="ctrl" id="prevBtn" aria-label="上一段">
      <svg viewBox="0 0 24 24"><polygon points="19,20 9,12 19,4"/><rect x="5" y="4" width="2" height="16"/></svg>
    </button>
    <button class="ctrl speed" id="speedBtn">1.0x</button>
    <button class="ctrl" id="nextBtn" aria-label="下一段">
      <svg viewBox="0 0 24 24"><polygon points="5,4 15,12 5,20"/><rect x="17" y="4" width="2" height="16"/></svg>
    </button>
  </div>

  <div class="up-next" id="upNext"></div>

  <div class="transcript" id="transcript">
    <div class="t-label">Transcript</div>
    <div class="t-en" id="tEn"></div>
    <div class="t-zh" id="tZh"></div>
  </div>
</div>

<!-- 功能抽屉 -->
<div class="drawer-mask" id="drawerMask"></div>
<aside class="drawer" id="drawer">
  <h3>听力难度</h3>
  <div class="row" data-setting="level" data-value="easy"><span class="label">初级</span><span class="value">A2</span></div>
  <div class="row" data-setting="level" data-value="medium"><span class="label">中等</span><span class="value active">B1-B2</span></div>
  <div class="row" data-setting="level" data-value="hard"><span class="label">进阶</span><span class="value">C1</span></div>

  <h3>字幕显示</h3>
  <div class="row" data-setting="subtitle" data-value="off"><span class="label">关闭</span><span class="value"></span></div>
  <div class="row" data-setting="subtitle" data-value="en"><span class="label">仅英文</span><span class="value"></span></div>
  <div class="row" data-setting="subtitle" data-value="bilingual"><span class="label">双语</span><span class="value active"></span></div>

  <h3>主题偏好</h3>
  <div class="row" data-setting="topic" data-value="daily"><span class="label">日常交流</span><span class="value active">已选</span></div>
  <div class="row" data-setting="topic" data-value="news"><span class="label">时事新闻</span><span class="value active">已选</span></div>
  <div class="row" data-setting="topic" data-value="drama"><span class="label">美剧英剧精读</span><span class="value active">已选</span></div>

  <h3>数据</h3>
  <div class="row" id="openWeekly"><span class="label">每周总结</span><span class="value">›</span></div>
  <div class="row" id="openOffline"><span class="label">离线下载管理</span><span class="value">›</span></div>
  <div class="row" id="clearData"><span class="label" style="color:var(--warn)">清除全部数据</span><span class="value">›</span></div>
</aside>

<!-- 每周总结视图 -->
<div class="view" id="weeklyView">
  <div class="view-header">
    <button class="back" data-close="weeklyView"><svg viewBox="0 0 24 24"><polyline points="15,18 9,12 15,6"/></svg></button>
    <h2>每周总结</h2>
  </div>
  <div id="weeklyContent"></div>
</div>

<!-- 离线管理视图 -->
<div class="view" id="offlineView">
  <div class="view-header">
    <button class="back" data-close="offlineView"><svg viewBox="0 0 24 24"><polyline points="15,18 9,12 15,6"/></svg></button>
    <h2>离线管理</h2>
  </div>
  <div id="offlineContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   每日听力 - 用 iPhone 自带语音朗读内置材料
   ============================================================ */
(function(){
  'use strict';
  const $ = (id) => document.getElementById(id);
  const synth = window.speechSynthesis;

  const DAILY_GOAL_SEC = 30 * 60;
  const RING_CIRC = 2 * Math.PI * 105;
  const WORDS_PER_MIN = 150; // 英语朗读基准

  /* ---------- 内置听力材料（12 段，约 30 分钟） ---------- */
  const MATERIALS = [
    /* === 日常交流 === */
    { id:'d1', topic:'daily', title:'At a Coffee Shop',
      en:"Hi, welcome to Green Bean Cafe. What can I get for you today? Hi, I'd like a medium latte, please. Sure. Would you like that hot or iced? Hot, please. And would you like any syrup? We have vanilla, caramel, and hazelnut. Just vanilla, one pump, please. Got it. Any pastry to go with that? We have fresh croissants and blueberry muffins. A croissant sounds great. Is it warmed? Yes, I can warm it for you. That would be perfect. Your total is six dollars and forty cents. Can I get your name for the cup? It's Sarah. Thank you, Sarah. Your latte will be ready in just a moment. Thanks so much.",
      zh:'在咖啡店。欢迎来到绿豆咖啡馆，今天想喝点什么？我要一杯中杯拿铁。热的还是冰的？热的。要加糖浆吗？有香草、焦糖和榛果。香草，一泵就好。好的，要不要来点糕点？我们有新鲜可颂和蓝莓玛芬。一个可颂不错，能加热吗？可以的。那就太好了。一共六块四。你叫什么名字？我叫莎拉。谢谢莎拉，你的拿铁马上就好。'},
    { id:'d2', topic:'daily', title:'Asking for Directions',
      en:"Excuse me, sorry to bother you. I'm looking for the Central Library. Do you know how to get there? Sure. Go straight down this road for about two blocks. You'll see a big church on the corner. Turn left there, onto Park Street. Keep going for three blocks, and the library will be on your right, across from the post office. Is it within walking distance? Oh yes, about ten minutes on foot. If you don't want to walk, the number seven bus stops right in front of it. How long does the bus take? Maybe five minutes, but you might have to wait. Is there a subway station nearby? The nearest one is Central Station, about a fifteen minute walk from here. Alright, I'll walk. Thank you so much. You're welcome. Good luck!",
      zh:'问路。不好意思打扰一下，我在找中央图书馆，你知道怎么走吗？沿着这条路直走两个街区，在拐角会看到一个大教堂，左转到公园街。再走三个街区，图书馆就在右手边，邮局对面。走路能到吗？能，大概十分钟。不想走的话，7路公交车正好停在门口。公交要多久？五分钟吧，但可能要等。附近有地铁站吗？最近的是中央站，从这走十五分钟。好的，我走过去。非常感谢。不客气，祝你顺利！'},
    { id:'d3', topic:'daily', title:'Small Talk with a Colleague',
      en:"Morning! You're in early today. Yeah, I wanted to beat the traffic. How was your weekend? It was nice. I went hiking with my family on Saturday. The weather was perfect. That sounds lovely. Where did you go? We went to the hills outside the city. It was a bit crowded, but the views were worth it. Did you take any photos? Yeah, I'll show you later. How about you? Did you do anything fun? Mostly just caught up on sleep. I was exhausted from the week. Oh, I hear you. We have that big presentation this afternoon, right? Yeah, at three o'clock. Are you ready? I think so. I've gone through the slides twice already. Great. Let's grab coffee before it starts. My treat. Sounds good. Let's go.",
      zh:'同事寒暄。早啊，你今天来得真早。嗯，想避开堵车。周末过得怎么样？挺好的，周六和家人去爬山了，天气特别好。真不错，你们去哪了？去了城外的山里，人有点多，但风景值了。拍照了吗？拍了，一会给你看。你呢？玩了什么好玩的吗？基本就是补觉，这周太累了。理解。下午三点有那个大汇报对吧？对，三点。你准备好了吗？应该差不多，PPT已经过了两遍。好，我们开始前去喝杯咖啡吧，我请。好啊，走。'},
    { id:'d4', topic:'daily', title:'Looking for an Apartment',
      en:"Hi, I'm calling about the apartment you listed online. Is it still available? Yes, it is. It's a one bedroom on Main Street. Great. How much is the rent? It's twelve hundred dollars a month, including water. Electricity and internet are extra. Is there a minimum lease? Yes, a twelve month lease. We also require a security deposit of one month's rent. Are pets allowed? We allow cats, but no dogs. Do you have laundry in the building? Yes, there's a laundry room in the basement. And parking? There's a spot in the back lot for an extra fifty dollars a month. Can I come see it this afternoon? Sure, between two and four is fine. I'll send you the address. Perfect. See you then.",
      zh:'租房。你好，我打电话是想问网上那套公寓，还在吗？在的，是主街上的一居室。好的，租金多少？一个月一千二，含水费。电费和网费另算。最少租多久？一年起租，还要一个月押金。可以养宠物吗？可以养猫，不能养狗。楼里有洗衣房吗？地下室有。停车呢？后院车位，每月加五十。我今天下午能看看房吗？可以，两点到四点。我把地址发你。好，一会见。'},

    /* === 时事新闻（慢速） === */
    { id:'n1', topic:'news', title:'Study: Remote Work Boosts Productivity',
      en:"A new study published this week finds that employees who work from home at least three days a week are, on average, thirteen percent more productive than those who work fully in the office. The researchers followed over five hundred workers at a large technology company for six months. They measured productivity by completed projects, meeting efficiency, and self reported satisfaction. The study also found that remote workers took fewer sick days and reported lower stress levels. However, the researchers noted that fully remote workers sometimes felt isolated, and missed informal conversations that often lead to new ideas. The company says it will continue to offer hybrid schedules. Experts say the findings suggest that a flexible approach, rather than a one size fits all policy, may work best for both employers and employees.",
      zh:'远程工作研究。本周发表的一项新研究发现，每周至少在家工作三天的员工，效率比完全坐班的员工平均高百分之十三。研究人员跟踪了一家大型科技公司的五百多名员工，为期六个月。他们通过完成项目数量、会议效率和自我满意度来衡量效率。研究还发现远程员工病假更少、压力水平更低。但研究人员也指出，完全远程的员工有时会感到孤立，也会想念那些常常催生新想法的非正式交流。该公司表示将继续提供混合排班。专家认为，灵活的方式比一刀切政策对雇主和员工都更好。'},
    { id:'n2', topic:'news', title:'City Launches New Bike Sharing Program',
      en:"The city transportation department announced Tuesday that a new bike sharing program will launch next month. Residents will be able to unlock one of two thousand bikes using a smartphone app. The first five minutes are free, and after that riders pay fifteen cents per minute. The program aims to reduce traffic congestion and lower carbon emissions. Over one hundred docking stations will be placed near subway stops, parks, and shopping districts. City officials say similar programs in other cities have reduced short car trips by up to twenty percent. However, some residents have raised concerns about bikes being left on sidewalks. In response, the city says it will add extra parking spots and send staff to clear up improperly parked bikes twice a day.",
      zh:'共享单车计划。市交通局周二宣布，一个新的共享单车项目将于下月启动。市民可以用手机 app 解锁两千辆自行车中的任意一辆。前五分钟免费，之后每分钟十五美分。该项目旨在缓解交通拥堵、降低碳排放。地铁站、公园和商业区附近将设一百多个停车点。市政府表示，其他城市的类似项目已使短途驾车出行减少了百分之二十。不过一些居民担心自行车会被随意扔在人行道上。作为回应，市政府表示会增加停车位，并每天两次派工作人员清理乱停的自行车。'},
    { id:'n3', topic:'news', title:'Weather: Rain Expected This Weekend',
      en:"The national weather service is predicting heavy rain across the region this weekend. Forecasters say the storm will arrive late Friday night and continue through Sunday afternoon. Up to eighty millimeters of rain could fall in some areas. Residents are advised to clear gutters and move outdoor furniture indoors. Drivers should expect slippery roads and possible flooding in low lying areas. Schools in several counties have already announced that outdoor events on Saturday will be moved indoors. Next week, the weather is expected to clear up, with sunny skies and temperatures returning to around twenty two degrees. The weather service will update its forecast on Friday morning.",
      zh:'天气预报。国家气象局预测本周末该地区将有大雨。预报员称，风暴将在周五深夜到达，持续到周日下午。部分地区降雨量可能达到八十毫米。建议居民清理排水沟，把户外家具搬进室内。司机应注意路滑，低洼地区可能积水。多个县的学校已宣布周六的户外活动将移至室内。下周天气预计转晴，气温回升到二十二度左右。气象局将在周五早上更新预报。'},
    { id:'n4', topic:'news', title:'Libraries Add Free Audio Book Service',
      en:"Public libraries across the country are expanding their free audio book services. Starting this month, library card holders can borrow up to ten audio books at a time using a new app, with no waiting lists for most popular titles. The program is funded by a three million dollar government grant. Library officials say they noticed a twenty percent increase in audio book borrowing last year, especially among younger readers. The app also includes features that let readers adjust narration speed and set sleep timers. Some critics worry that the service might reduce physical book borrowing, but early data suggests that audio book users also borrow more physical books than before. The service is available to all library members at no extra cost.",
      zh:'图书馆增加免费有声书服务。全国各地的公共图书馆正在扩展免费有声书服务。从本月起，持借书证的读者可以通过一个新 app 同时借阅十本有声书，大多数热门书目无需等待名单。该项目由政府三百万美元拨款资助。图书馆官员表示，他们注意到去年有声书借阅量增长了百分之二十，年轻读者尤其明显。这个 app 还允许读者调节朗读音速、设置睡眠定时。有评论担心这项服务会减少纸质书借阅，但早期数据显示，有声书用户借阅的纸质书也比以前更多。该服务对所有图书馆会员免费开放。'},

    /* === 影视精读（剧本对白） === */
    { id:'f1', topic:'drama', title:'Friends: The One with the Late Text',
      en:"Scene: A coffee shop. RACHEL, ROSS, and MONICA are sitting at a table. RACHEL: Okay, tell me again why you didn't text her back. ROSS: Because! If I text her back right away, she's gonna think I was sitting by my phone. MONICA: You were sitting by your phone. ROSS: That is not the point! The point is, I need to play it cool. RACHEL: Ross, you played cool for three days. She probably thinks you're not interested. ROSS: Wait, is that bad? MONICA: Yes, that is bad. ROSS: Okay, okay, what do I do? RACHEL: You text her. Right now. Say, hey, sorry I missed your call, I was in a meeting. ROSS: That's a lie. I was watching old cartoons. MONICA: And that is exactly why we don't tell her the truth.",
      zh:'老友记：未回短信那一集。场景：咖啡馆。瑞秋、罗斯、莫妮卡坐在桌边。瑞秋：好，再跟我说一遍，你为什么不回她短信。罗斯：因为！我要是马上回，她会觉得我一直守着手机。莫妮卡：你确实一直守着手机。罗斯：重点不是这个！重点是，我得装得淡定一点。瑞秋：罗斯，你已经淡定了三天了，她可能觉得你没意思。罗斯：等等，那很糟吗？莫妮卡：对，非常糟。罗斯：好吧，我该怎么办？瑞秋：现在就给她发短信，说：嘿，抱歉没接到电话，刚才在开会。罗斯：那是撒谎，我在看老动画片。莫妮卡：所以才说不能跟她说实话。'},
    { id:'f2', topic:'drama', title:'The Office: The Job Interview',
      en:"MICHAEL: Hello! And welcome to Dunder Mifflin. I'm Michael Scott, regional manager. INTERVIEWER: Nice to meet you, Mr. Scott. Thank you for making time. MICHAEL: Oh, please, call me Michael. So, tell me about yourself. INTERVIEWER: Well, I've been in sales for eight years. MICHAEL: Eight years! That's longer than I've been alive. Just kidding. INTERVIEWER: ...MICHAEL: Okay, serious question. Where do you see yourself in five years? INTERVIEWER: I'd like to be running a small team, maybe in a regional role. MICHAEL: A regional role. Like... mine? INTERVIEWER: I didn't mean it that way. MICHAEL: It's okay. I respect ambition. You know what, you're hired. INTERVIEWER: Just like that? MICHAEL: Hey, I know talent when I see it. Welcome to the team.",
      zh:'办公室：求职面试。迈克尔：你好！欢迎来到 Dundler Mifflin，我是地区经理迈克尔·斯科特。面试官：很高兴见到您，斯科特先生，感谢您拨冗。迈克尔：请叫我迈克尔。跟我说说你自己。面试官：我做销售八年了。迈克尔：八年！比我活的时间都长。开玩笑的。面试官：……迈克尔：好，正经问题。五年后你想做什么？面试官：我想带一个小团队，也许做个地区负责人。迈克尔：地区负责人。比如……我的位置？面试官：我不是那个意思。迈克尔：没关系，我欣赏有野心的人。这样吧，你被录用了。面试官：就这么定了？迈克尔：我一眼就能看出人才。欢迎加入。'},
    { id:'f3', topic:'drama', title:'Sherlock: The First Meeting',
      en:"JOHN: So, this all seems rather fantastic. You think you can tell all that just by looking at me? SHERLOCK: I can tell you were in Afghanistan. Or Iraq. The pain in your leg says army. The limp is psychosomatic, by the way. JOHN: How on earth could you possibly know that? SHERLOCK: I observe. Most people don't. Your haircut is military. Your posture is military. But you hold yourself like you're in pain. You look down when you walk, not because of the leg, but because you're thinking. JOHN: That's impossible. SHERLOCK: And you have a phone. An expensive phone. But you're clearly not wealthy. Someone gave it to you. JOHN: My sister gave it to me. SHERLOCK: Ah. Estranged. You check it constantly, hoping for a message that will never come. JOHN: ...We should get coffee sometime.",
      zh:'神探夏洛克：初次见面。约翰：这一切也太离谱了。你觉得光看我就能知道这些？夏洛克：我能看出来你在阿富汗待过，或者伊拉克。你腿疼说明你当过兵。顺便说一句，那是心理性的跛行。约翰：你到底怎么知道的？夏洛克：我观察，大多数人不会。你的发型是军人的，站姿也是，但你走路的样子像是在忍痛。你走路时低头，不是因为腿，而是因为在思考。约翰：这不可能。夏洛克：你还有一部手机。很贵的手机，但你显然不富裕，是别人给你的。约翰：我姐姐给的。夏洛克：啊。关系疏远。你不停看手机，希望收到一条永远不会来的消息。约翰：……我们找个时间喝杯咖啡吧。'},
    { id:'f4', topic:'drama', title:'Modern Family: Family Dinner',
      en:"CLAIRE: Who wants more lasagna? PHIL: I do, but the kids said if I have a third piece they're taking my credit card. LUKE: Dad, you had two plates already. ALEX: Actually, that's three. PHIL: Three? I only remember two. CLAIRE: You have a problem, Phil. PHIL: I have a healthy appreciation for Italian cuisine. LUKE: Can I be excused? I have homework. CLAIRE: You just sat down. Finish your vegetables. LUKE: But they're green. CLAIRE: That's the point. MITCH: Hey, everybody. Sorry we're late. Cam got stuck at the petting zoo. CAM: A goat ate my tie. I had to rescue it. LILY: We brought doughnuts. CLAIRE: Doughnuts? Before dinner? CAM: They're a peace offering.",
      zh:'摩登家庭：家庭晚餐。克莱尔：谁还要千层面？菲尔：我要，但孩子们说我要再吃一块就收走我的信用卡。卢克：爸，你已经吃了两盘了。亚历克斯：其实是三盘。菲尔：三盘？我只记得两盘。克莱尔：菲尔，你有问题。菲尔：我只是对意大利菜有健康的欣赏。卢克：我能离席吗？我有作业。克莱尔：你刚坐下，把菜吃完。卢克：可它们是绿的。克莱尔：所以才让你吃。米奇：大家好，抱歉来晚了，小卡在动物园被卡住了。小卡：一只山羊吃了我的领带，我得去救它。莉莉：我们带了甜甜圈。克莱尔：晚饭前吃甜甜圈？小卡：这是赔礼。'}
  ];

  /* ---------- 状态 ---------- */
  let state = {
    settings: { level: 'medium', subtitle: 'bilingual', speed: 1.0, topics: ['daily','news','drama'] },
    playlist: [], currentIndex: 0,
    history: {}, offline: false,
    playing: false, paused: false,
    wordIdx: 0, totalWords: 0, tickTimer: null
  };

  /* ---------- 工具 ---------- */
  function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function fmtTime(sec){ if(!sec||isNaN(sec))return '0:00'; sec=Math.floor(sec); return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'); }
  function fmtMin(sec){ return Math.round(sec/60); }
  function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2000); }
  function loadLS(k,d){ try{const v=localStorage.getItem('hl_'+k); return v?JSON.parse(v):d;}catch(e){return d;} }
  function saveLS(k,v){ try{localStorage.setItem('hl_'+k,JSON.stringify(v));}catch(e){} }
  function estDuration(ep){ return Math.round(ep.en.split(/\s+/).length / (WORDS_PER_MIN * state.settings.speed) * 60); }

  /* ---------- 初始化 ---------- */
  function init(){
    state.settings = Object.assign(state.settings, loadLS('settings', {}));
    state.history = loadLS('history', {});

    const now = new Date();
    const days = ['周日','周一','周二','周三','周四','周五','周六'];
    $('topDate').textContent = (now.getMonth()+1)+'月'+now.getDate()+'日 '+days[now.getDay()];

    // 根据主题偏好组装播放列表
    buildPlaylist();

    bindEvents();
    renderNowPlaying();
    renderToday();
    renderTranscript();

    // PWA
    if ('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')) {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    }
    window.addEventListener('online', ()=>{ state.offline=false; toast('网络已连接'); });
    window.addEventListener('offline', ()=>{ state.offline=true; toast('已离线，可继续收听'); });

    // 检查语音支持
    if (!synth) toast('当前浏览器不支持语音朗读');
  }

  function buildPlaylist(){
    const topics = state.settings.topics;
    state.playlist = MATERIALS.filter(m => topics.includes(m.topic));
    if (!state.playlist.length) state.playlist = MATERIALS.slice();
    state.currentIndex = 0;
  }

  /* ---------- 播放控制（TTS） ---------- */
  function togglePlay(){
    if (!state.playlist.length) return;
    if (state.playing && !state.paused) {
      synth.pause();
      state.paused = true;
      updatePlayIcon(false);
    } else if (state.playing && state.paused) {
      synth.resume();
      state.paused = false;
      updatePlayIcon(true);
    } else {
      speakCurrent();
    }
  }

  function speakCurrent(){
    const ep = state.playlist[state.currentIndex];
    if (!ep || !synth) return;
    synth.cancel();

    const u = new SpeechSynthesisUtterance(ep.en);
    u.rate = state.settings.speed;
    u.lang = 'en-US';
    // 尝试选一个英文语音
    const voices = synth.getVoices();
    const enVoice = voices.find(v => v.lang.startsWith('en') && /Google|Samantha|Daniel/i.test(v.name)) || voices.find(v => v.lang.startsWith('en'));
    if (enVoice) u.voice = enVoice;

    state.totalWords = ep.en.split(/\s+/).length;
    state.wordIdx = 0;

    u.onstart = () => {
      state.playing = true; state.paused = false;
      updatePlayIcon(true);
      startTick();
    };
    u.onboundary = (e) => {
      if (e.name === 'word') {
        state.wordIdx = e.charIndex ? ep.en.slice(0, e.charIndex).split(/\s+/).length : state.wordIdx;
        updateProgress();
      }
    };
    u.onend = () => {
      stopTick();
      state.playing = false;
      updatePlayIcon(false);
      markEpisodeDone();
      setTimeout(next, 600);
    };
    u.onerror = () => {
      stopTick();
      state.playing = false;
      updatePlayIcon(false);
    };

    synth.speak(u);
    renderNowPlaying();
    renderTranscript();
  }

  function updatePlayIcon(playing){
    $('playIcon').innerHTML = playing
      ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'
      : '<polygon points="6,4 20,12 6,20"/>';
    $('playBtn').classList.toggle('playing', playing);
  }

  function updateProgress(){
    const pct = state.totalWords ? state.wordIdx / state.totalWords * 100 : 0;
    $('progressFill').style.width = pct + '%';
    const ep = state.playlist[state.currentIndex];
    const total = estDuration(ep||{en:''});
    const cur = Math.round(total * pct / 100);
    $('curTime').textContent = fmtTime(cur);
    $('durTime').textContent = fmtTime(total);
  }

  function next(){
    if (state.playing) synth.cancel();
    stopTick();
    state.currentIndex = (state.currentIndex + 1) % state.playlist.length;
    speakCurrent();
  }
  function prev(){
    if (state.playing) synth.cancel();
    stopTick();
    state.currentIndex = (state.currentIndex - 1 + state.playlist.length) % state.playlist.length;
    speakCurrent();
  }

  function cycleSpeed(){
    const speeds = [0.75, 1.0, 1.25];
    const cur = speeds.indexOf(state.settings.speed);
    state.settings.speed = speeds[(cur+1) % speeds.length];
    $('speedBtn').textContent = state.settings.speed.toFixed(2).replace(/\.?0+$/,'') + 'x';
    saveLS('settings', state.settings);
    // 重新朗读当前段以应用新语速
    if (state.playing || state.paused) speakCurrent();
  }

  /* ---------- 播放计时 ---------- */
  function startTick(){
    stopTick();
    state.tickTimer = setInterval(()=>{
      if (!state.playing || state.paused) return;
      const today = todayStr();
      if (!state.history[today]) state.history[today] = { seconds:0, items:[] };
      state.history[today].seconds += 1;
      if (state.history[today].seconds % 30 === 0) saveLS('history', state.history);
      renderToday();
    }, 1000);
  }
  function stopTick(){ if (state.tickTimer) { clearInterval(state.tickTimer); state.tickTimer=null; } }

  function markEpisodeDone(){
    const ep = state.playlist[state.currentIndex];
    const today = todayStr();
    if (!state.history[today]) state.history[today] = { seconds:0, items:[] };
    if (!state.history[today].items.find(i => i.id === ep.id)) {
      state.history[today].items.push({ id:ep.id, title:ep.title, sec:estDuration(ep), done:true });
    }
    saveLS('history', state.history);
  }

  /* ---------- 渲染 ---------- */
  function renderNowPlaying(){
    const ep = state.playlist[state.currentIndex];
    if (!ep) { $('nowPlayingCard').style.display='none'; $('controlsRow').style.visibility='hidden'; return; }
    $('nowPlayingCard').style.display='block';
    $('controlsRow').style.visibility='visible';
    $('npTitle').textContent = ep.title;
    const tag = $('npTag');
    tag.textContent = ep.topic==='daily' ? '日常' : ep.topic==='news' ? '新闻' : '影视';
    tag.className = 'tag ' + ep.topic;
    $('progressWrap').style.display = 'block';
    const nextEp = state.playlist[(state.currentIndex+1) % state.playlist.length];
    if (nextEp) $('upNext').textContent = '下一段：' + nextEp.title;
  }

  function renderTranscript(){
    const ep = state.playlist[state.currentIndex];
    const sub = state.settings.subtitle;
    const box = $('transcript');
    if (sub==='off' || !ep) { box.classList.remove('show'); return; }
    box.classList.add('show');
    $('tEn').style.display = (sub==='en'||sub==='bilingual') ? 'block' : 'none';
    $('tZh').style.display = (sub==='zh'||sub==='bilingual') ? 'block' : 'none';
    $('tEn').textContent = ep.en;
    $('tZh').textContent = ep.zh;
  }

  function renderToday(){
    const today = state.history[todayStr()] || { seconds:0, items:[] };
    const sec = today.seconds||0;
    const min = fmtMin(sec);
    $('todaySeconds').textContent = min;
    const pct = Math.min(1, sec/DAILY_GOAL_SEC);
    $('ringFg').style.strokeDashoffset = RING_CIRC * (1-pct);
    if (sec >= DAILY_GOAL_SEC) {
      $('todayLabel').innerHTML = '<span class="goal-done">今日目标已达成</span> · 已听 '+min+' 分钟，继续保持';
    } else {
      const remain = Math.max(0, Math.round((DAILY_GOAL_SEC-sec)/60));
      $('todayLabel').textContent = '今日目标 30 分钟 · 还差 '+remain+' 分钟';
    }
  }

  /* ---------- 每周总结 ---------- */
  function renderWeekly(){
    const now = new Date();
    const day = now.getDay()||7;
    const monday = new Date(now);
    monday.setDate(now.getDate()-day+1); monday.setHours(0,0,0,0);

    let totalSec=0;
    let dailySecs=[0,0,0,0,0,0,0];
    let topicSecs={daily:0,news:0,drama:0};
    let episodeList=[];
    let metDays=0;

    for (let i=0;i<7;i++){
      const d = new Date(monday); d.setDate(monday.getDate()+i);
      const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      const rec = state.history[key];
      if (rec) {
        dailySecs[i] = rec.seconds||0;
        totalSec += rec.seconds||0;
        if ((rec.seconds||0) >= DAILY_GOAL_SEC) metDays++;
        (rec.items||[]).forEach(it => episodeList.push({...it, date:key}));
      }
    }
    // 主题按本周听过的条目累计
    episodeList.forEach(it => {
      const m = MATERIALS.find(x => x.id === it.id);
      if (m && topicSecs[m.topic] !== undefined) topicSecs[m.topic] += (it.sec||180);
    });
    const topicTotal = topicSecs.daily+topicSecs.news+topicSecs.drama || 1;
    const totalMin = fmtMin(totalSec);
    const goalPct = Math.round(totalSec/(DAILY_GOAL_SEC*7)*100);
    const days = ['一','二','三','四','五','六','日'];
    const maxBar = Math.max(...dailySecs, DAILY_GOAL_SEC);

    let html = '<div class="weekly-hero">'+
      '<div class="big">'+totalMin+'<span class="unit"> 分钟</span></div>'+
      '<div class="sub">本周总听力时长 · 目标完成率 '+goalPct+'%</div>'+
      (metDays>0 ? '<div class="streak">'+metDays+' 天达成 30 分钟目标</div>' : '<div class="streak" style="background:var(--bg-soft);color:var(--ink-faint)">本周还未达成目标</div>')+
      '</div>'+
      '<div class="section-title">主题分布</div>'+
      '<div class="topic-bar">'+
        '<div class="seg daily" style="width:'+(topicSecs.daily/topicTotal*100)+'%"></div>'+
        '<div class="seg news" style="width:'+(topicSecs.news/topicTotal*100)+'%"></div>'+
        '<div class="seg drama" style="width:'+(topicSecs.drama/topicTotal*100)+'%"></div>'+
      '</div>'+
      '<div class="legend">'+
        '<span><span class="dot" style="background:#2D5A3D"></span>日常 '+fmtMin(topicSecs.daily)+'分</span>'+
        '<span><span class="dot" style="background:#B8923A"></span>新闻 '+fmtMin(topicSecs.news)+'分</span>'+
        '<span><span class="dot" style="background:#6B3A6B"></span>影视 '+fmtMin(topicSecs.drama)+'分</span>'+
      '</div>'+
      '<div class="section-title">每日时长</div>'+
      '<div class="days-grid">';

    for (let i=0;i<7;i++){
      const h = (dailySecs[i]/maxBar*100).toFixed(1);
      const met = dailySecs[i] >= DAILY_GOAL_SEC;
      html += '<div class="day-col"><div class="bar '+(met?'met':'')+'" style="height:'+h+'%"></div><div class="day-label">'+days[i]+'</div></div>';
    }
    html += '</div>';

    if (episodeList.length) {
      html += '<div class="section-title">听过的内容</div>';
      episodeList.slice(0,20).forEach(it => {
        html += '<div class="episode-item"><div class="ep-title">'+(it.title||'未命名')+'</div>'+
          '<div class="ep-meta"><span>'+it.date+'</span><span>'+fmtMin(it.sec||0)+' 分钟</span></div></div>';
      });
    } else {
      html += '<div class="section-title">听过的内容</div><div class="loading">本周还没有播放记录</div>';
    }
    $('weeklyContent').innerHTML = html;
  }

  /* ---------- 离线管理 ---------- */
  function renderOffline(){
    const total = MATERIALS.length;
    const html =
      '<div class="offline-card">'+
        '<div class="row"><span class="k">内置材料</span><span class="v">'+total+' 段</span></div>'+
        '<div class="row"><span class="k">今日播放列表</span><span class="v">'+state.playlist.length+' 段</span></div>'+
        '<div class="row"><span class="k">网络状态</span><span class="v">'+(state.offline?'离线':'在线')+'</span></div>'+
      '</div>'+
      '<div style="font-size:13px;color:var(--ink-soft);line-height:1.7;margin-top:8px">'+
        '所有听力材料和朗读功能都内置在页面里，<b>完全不需要网络</b>。'+
        '首次打开后，把网页"添加到主屏幕"，之后飞行模式下也能正常听。'+
      '</div>';
    $('offlineContent').innerHTML = html;
  }

  /* ---------- 事件绑定 ---------- */
  function bindEvents(){
    $('playBtn').onclick = togglePlay;

    $('progressBar').onclick = (e) => {
      // TTS 不能精确跳转，只做提示
      toast('拖动进度暂不支持，可点上一段/下一段切换');
    };

    $('nextBtn').onclick = next;
    $('prevBtn').onclick = prev;
    $('speedBtn').onclick = cycleSpeed;
    $('speedBtn').textContent = state.settings.speed.toFixed(2).replace(/\.?0+$/,'')+'x';

    $('openDrawer').onclick = () => { $('drawer').classList.add('open'); $('drawerMask').classList.add('open'); };
    $('drawerMask').onclick = closeDrawer;
    function closeDrawer(){ $('drawer').classList.remove('open'); $('drawerMask').classList.remove('open'); }

    document.querySelectorAll('.drawer .row[data-setting]').forEach(row => {
      row.onclick = () => {
        const key = row.dataset.setting, val = row.dataset.value;
        if (key==='level') {
          state.settings.level = val;
          document.querySelectorAll('.row[data-setting="level"] .value').forEach(v=>v.classList.remove('active'));
          row.querySelector('.value').classList.add('active');
        } else if (key==='subtitle') {
          state.settings.subtitle = val;
          document.querySelectorAll('.row[data-setting="subtitle"] .value').forEach(v=>v.classList.remove('active'));
          row.querySelector('.value').classList.add('active');
          renderTranscript();
        } else if (key==='topic') {
          const idx = state.settings.topics.indexOf(val);
          if (idx>=0) { state.settings.topics.splice(idx,1); row.querySelector('.value').textContent=''; row.querySelector('.value').classList.remove('active'); }
          else { state.settings.topics.push(val); row.querySelector('.value').textContent='已选'; row.querySelector('.value').classList.add('active'); }
          buildPlaylist();
          renderNowPlaying();
          renderTranscript();
        }
        saveLS('settings', state.settings);
      };
    });

    // 初始化选中态
    document.querySelectorAll('.row[data-setting="level"]').forEach(r=>r.querySelector('.value').classList.toggle('active', r.dataset.value===state.settings.level));
    document.querySelectorAll('.row[data-setting="subtitle"]').forEach(r=>r.querySelector('.value').classList.toggle('active', r.dataset.value===state.settings.subtitle));
    document.querySelectorAll('.row[data-setting="topic"]').forEach(r=>{
      const on = state.settings.topics.includes(r.dataset.value);
      r.querySelector('.value').textContent = on?'已选':'';
      r.querySelector('.value').classList.toggle('active', on);
    });

    $('openWeekly').onclick = () => { closeDrawer(); renderWeekly(); $('weeklyView').classList.add('open'); };
    $('openOffline').onclick = () => { closeDrawer(); renderOffline(); $('offlineView').classList.add('open'); };
    document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => $(b.dataset.close).classList.remove('open'));

    $('clearData').onclick = () => {
      if (confirm('确定清除所有播放记录和设置吗？')) {
        localStorage.clear();
        state.history = {};
        state.settings = { level:'medium', subtitle:'bilingual', speed:1.0, topics:['daily','news','drama'] };
        buildPlaylist();
        toast('已清除'); closeDrawer(); renderToday(); renderNowPlaying(); renderTranscript();
      }
    };

    // 预加载语音列表（iOS 需要）
    if (synth && synth.getVoices().length === 0) {
      synth.onvoiceschanged = ()=>{};
    }
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
